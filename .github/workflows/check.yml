name: Check

# Every push and pull request, on every branch: the full reproducibility
# checks (check-all.sh + verify.sh) and a book render with a link check, so
# a broken chapter is caught here before pages.yml deploys it from master.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash   # bash -eo pipefail

env:
  MDBOOK_VERSION: "0.4.40"   # keep in step with pages.yml
  # stage0-posix's .gitmodules fetches its nested mescc-tools from
  # git.savannah.nongnu.org, which is often slow or unreachable; fetch the
  # same pinned commit from the GitHub mirror instead (README "Get the
  # sources" gives users the same command).
  SAVANNAH_MESCC: https://git.savannah.nongnu.org/git/mescc-tools.git
  GITHUB_MESCC: https://github.com/oriansj/mescc-tools.git

jobs:
  check:
    name: check-all + verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        # submodules are fetched below, with the savannah URL rewritten

      - name: Fetch submodules (recursive)
        run: |
          git -c "url.${GITHUB_MESCC}.insteadOf=${SAVANNAH_MESCC}" \
              submodule update --init --recursive
          git submodule status --recursive

      - name: Allow unprivileged user namespaces
        # The test scripts give each seed-forth run a private /tmp with
        # `unshare -rm` when they can (and fall back to the shared /tmp when
        # they can't).  Ubuntu 24.04's AppArmor blocks it by default; lift
        # that so CI exercises the same path as a developer machine.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare -rm true && echo "unshare -rm: available" || echo "unshare -rm: unavailable"

      - name: Tool versions
        run: |
          uname -a
          gcc --version | head -1
          python3 --version
          bash --version | head -1

      - name: check-all.sh
        run: |
          mkdir -p "$RUNNER_TEMP/check-all"
          TMPDIR="$RUNNER_TEMP/check-all" ./check-all.sh

      - name: Seed-only amd64 tooling and isolated root
        run: tests/pnut/host-tools-check.sh

      - name: verify.sh
        run: ./verify.sh

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: |
            ${{ runner.temp }}/check-all/*.log
            build-out/**/*.log
          if-no-files-found: ignore
          retention-days: 14

  book:
    name: mdbook build + links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "$url" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the book (warnings fail the job)
        run: |
          mdbook build -d "$RUNNER_TEMP/book" 2>&1 | tee "$RUNNER_TEMP/mdbook.log"
          if grep -E '\[(WARN|ERROR)\]' "$RUNNER_TEMP/mdbook.log"; then
              echo "::error::mdbook build printed warnings"; exit 1
          fi

      - name: Check links and heading anchors
        # Markdown-level check (the same one check-all.sh runs), cross-checked
        # against the heading ids mdBook actually rendered.
        run: python3 tools/check-links.py --html "$RUNNER_TEMP/book"

      - name: Upload rendered book
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: book-html
          path: ${{ runner.temp }}/book
          retention-days: 7
